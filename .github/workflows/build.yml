name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "Secrets未設定のため、リポジトリ内の固定鍵で署名します"
          fi

      - name: テストとビルド
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APKの名前を整える
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/downloader-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: downloader-v${{ github.run_number }}
          path: out/*.apk

      - name: Releaseに公開（スマホからダウンロード用）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ダウンローダー v1.0.${{ github.run_number }}
          body: "${{ github.event.head_commit.message }}"
          files: out/*.apk
          make_latest: true
